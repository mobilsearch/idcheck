<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>신분확인</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--ink:#17202a;--blue:#1e5f93;--green:#1f7a4d;--red:#b42318;--bg:#eef2f5;--line:#c7d0d9}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{background:#183d5b;color:#fff;padding:14px 16px;text-align:center;font-weight:900;font-size:21px}
.wrap{max-width:520px;margin:0 auto;padding:13px}
.card{background:#fff;border:1px solid #c9d2da;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.hidden{display:none!important}
h2{font-size:18px;margin:0 0 10px}
label{font-weight:800;font-size:13px;display:block;margin:10px 0 5px}
input,select{width:100%;height:46px;border:1.5px solid #9caaba;border-radius:9px;padding:0 11px;font-size:16px;background:#fff}
button{width:100%;min-height:46px;border:0;border-radius:9px;font-size:16px;font-weight:900;cursor:pointer}
.primary{background:var(--blue);color:#fff;margin-top:12px}
.green{background:var(--green);color:#fff;margin-top:10px}
.gray{background:#e5eaee;color:#24333f;margin-top:8px}
.danger{background:#fff1f0;color:var(--red);border:1px solid #efb4ae}
.note{font-size:12px;color:#5c6975;line-height:1.45;margin-top:8px}
.status{font-weight:800;text-align:center;padding:8px;border-radius:8px;background:#f1f5f8;margin:8px 0;font-size:13px}
.scanBox{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4}
video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:5%;right:5%;top:30%;aspect-ratio:1.586/1;border:3px solid rgba(255,255,255,.92);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.15)}
.scanHelp{position:absolute;left:7%;right:7%;bottom:7%;background:rgba(0,0,0,.62);color:#fff;padding:8px;border-radius:8px;text-align:center;font-weight:800;font-size:13px}
.person{border:2px solid #1e5f93;border-radius:12px;padding:12px;margin-top:10px;background:#f7fbff}
.personName{font-size:25px;font-weight:950;margin-bottom:8px}
.grid{display:grid;grid-template-columns:72px 1fr;gap:0;border:1px solid #b9c4cd}
.k,.v{padding:7px;border-bottom:1px solid #d1d8de}
.k{background:#f1f3f5;font-weight:900;text-align:center}
.v{font-weight:800}
.candidate{border:1px solid #b6c4cf;border-radius:10px;padding:10px;margin-top:8px;background:#fff}
.candidate button{margin-top:7px;background:#2f6f9e;color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#eaf3f8;font-size:12px;font-weight:900}
#otherTypeBox{margin-top:6px}
footer{text-align:center;font-size:11px;color:#667580;padding:8px 0 18px}
</style>
</head>
<body>
<header>동원훈련 신분확인</header>
<div class="wrap">

<section id="login" class="card">
<h2>신분확인 담당자 인증</h2>
<label>소속</label><input id="opOrg" value="119여단 2대대" placeholder="소속 입력">
<label>직책</label><input id="opRole" placeholder="예: 인사담당">
<label>성명</label><input id="opName" placeholder="담당자 성명">
<button class="primary" id="loginBtn">사용 시작</button>
<div class="note"><b>확인자명부</b>에 등록된 사용자만 접속가능합니다.<br>인증은 2시간 유지되며, 2시간 이내에는 브라우저나 단말을 껐다 켜도 자동 복귀합니다.</div>
<div id="loginMsg" class="status hidden"></div>
</section>

<section id="scan" class="hidden">
<div class="card">
<h2>신분증 / 바코드 자동인식</h2>
<div id="scanStatus" class="status">카메라 준비 중...</div>
<div class="scanBox">
<video id="video" autoplay playsinline muted></video>
<div class="frame"></div>
<div class="scanHelp">신분증은 가로로 흰색 틀 안에 맞춰주세요<br>개인 바코드는 화면 안에 보여주세요</div>
</div>
<button class="gray" id="nameSearchBtn">인식이 안 되면 성명 검색</button>
<div class="note">신분증 사진은 저장하지 않습니다. OCR용 순간 화면만 브라우저 메모리에서 사용합니다.</div>
</div>
</section>

<section id="search" class="card hidden">
<h2>성명 검색</h2>
<label>신분증 수단</label>
<select id="searchIdType">
<option value="">선택하세요</option>
<option>주민등록증</option>
<option>운전면허증</option>
<option>PASS 모바일신분증</option>
<option>기타</option>
</select>
<div id="searchOtherBox" class="hidden">
<label>기타 신분증 수단</label><input id="searchOther" placeholder="직접 입력">
</div>
<label>성명</label>
<div class="row"><input id="searchName" placeholder="성명 입력"><button class="primary" id="searchBtn" style="margin-top:0">검색</button></div>
<div id="searchMsg" class="status hidden"></div>
<div id="candidates"></div>
<button class="gray" id="backScanBtn">카메라로 돌아가기</button>
</section>

<section id="result" class="card hidden">
<div><span class="badge" id="methodBadge"></span></div>
<div class="person">
<div id="rName" class="personName"></div>
<div class="grid">
<div class="k">군번</div><div class="v" id="rMilitary"></div>
<div class="k">중대</div><div class="v" id="rCompany"></div>
<div class="k">소대</div><div class="v" id="rPlatoon"></div>
<div class="k">직책</div><div class="v" id="rRole"></div>
<div class="k">총번</div><div class="v" id="rGun"></div>
<div class="k">내무실</div><div class="v" id="rRoom"></div>
</div>
</div>
<label>신분증 수단 <span style="color:#b42318">*</span></label>
<select id="idType">
<option value="">선택하세요</option>
<option>주민등록증</option>
<option>운전면허증</option>
<option>PASS 모바일신분증</option>
<option>기타</option>
</select>
<div id="otherTypeBox" class="hidden"><input id="idTypeOther" placeholder="기타 신분증 수단 직접 입력"></div>
<button class="green" id="confirmBtn">신분확인 완료</button>
<button class="gray" id="cancelBtn">다시 스캔</button>
<div id="resultMsg" class="status hidden"></div>
</section>

<footer>119여단 2대대 · 신분확인 전용</footer>
</div>

<canvas id="ocrCanvas" class="hidden"></canvas>

<script>
const API = "https://script.google.com/macros/s/AKfycbzXm3I6ZbSifB7H9U9krGplLTsChmepjgZ-wAY7L1qI02TjnwS1viMjsARtWtNamd_8TQ/exec";
let token='', rosterNames=[], stream=null, detector=null, ocrWorker=null;
let ocrReady=false, ocrBusy=false, scanBusy=false, currentPerson=null, currentMethod='';
let pendingDetectedType='', lastDetectAt=0, ocrTimer=null, scanActive=false;

const $=id=>document.getElementById(id);
function show(id){ ['login','scan','search','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id)); }
function msg(el,txt,bad=false){ el.textContent=txt; el.classList.remove('hidden'); el.style.color=bad?'#b42318':'#173b59'; }
function clearMsg(el){ el.classList.add('hidden'); el.textContent=''; }

function jsonp(action, params={}){
  return new Promise((resolve,reject)=>{
    const cb='__idcb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const q=new URLSearchParams({action,callback:cb,...params});
    window[cb]=r=>{ cleanup(); resolve(r); };
    function cleanup(){ try{delete window[cb]}catch(_ ){}; s.remove(); }
    s.onerror=()=>{cleanup();reject(new Error('서버 연결 실패'));};
    s.src=API+'?'+q.toString();
    document.body.appendChild(s);
    setTimeout(()=>{ if(window[cb]){cleanup();reject(new Error('서버 응답 지연'));} },12000);
  });
}


async function restoreSession(){
  const savedToken=localStorage.getItem('idcheckToken')||'';
  const expiresAt=Number(localStorage.getItem('idcheckExpiresAt')||'0');

  if(!savedToken || !expiresAt || Date.now()>=expiresAt){
    localStorage.removeItem('idcheckToken');
    localStorage.removeItem('idcheckExpiresAt');
    return false;
  }

  try{
    const n=await jsonp('rosterNames',{token:savedToken});
    if(!n.ok){
      localStorage.removeItem('idcheckToken');
      localStorage.removeItem('idcheckExpiresAt');
      return false;
    }
    token=savedToken;
    rosterNames=n.names||[];
    show('scan');
    await startCamera();
    initOcr();
    return true;
  }catch(_){
    return false;
  }
}

async function login(){
  const org=$('opOrg').value.trim(), role=$('opRole').value.trim(), name=$('opName').value.trim();
  if(!org||!role||!name) return msg($('loginMsg'),'소속·직책·성명을 모두 입력해 주세요.',true);
  msg($('loginMsg'),'확인 중...');
  try{
    const r=await jsonp('operatorLogin',{org,role,name});
    if(!r.ok) return msg($('loginMsg'),r.error||'사용할 수 없습니다.',true);
    token=r.token; const expiresAt=Date.now()+2*60*60*1000; localStorage.setItem('idcheckToken',token); localStorage.setItem('idcheckExpiresAt',String(expiresAt));
    clearMsg($('loginMsg'));
    const n=await jsonp('rosterNames',{token});
    rosterNames=n.ok?n.names:[];
    show('scan'); await startCamera(); initOcr();
  }catch(e){ msg($('loginMsg'),e.message,true); }
}

async function startCamera(){
  try{
    // 이미 권한을 받은 카메라 스트림이 살아 있으면 재사용한다.
    // 성명검색/결과화면을 다녀와도 getUserMedia를 다시 호출하지 않으므로
    // 같은 브라우저 세션에서는 카메라 권한을 다시 묻지 않는다.
    if(stream && stream.getVideoTracks().some(t=>t.readyState==='live')){
      stream.getVideoTracks().forEach(t=>t.enabled=true);
      $('video').srcObject=stream;
    }else{
      stream=await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{ideal:'environment'},
          width:{ideal:1920},
          height:{ideal:1080}
        },
        audio:false
      });
      $('video').srcObject=stream;
    }

    scanActive=true;
    msg($('scanStatus'),'신분증은 가로로 흰색 틀 안에 맞춰주세요.');

    if('BarcodeDetector' in window){
      try{ detector=new BarcodeDetector({formats:['code_128','qr_code','data_matrix','ean_13','ean_8']}); }
      catch(_){ detector=new BarcodeDetector(); }
      requestAnimationFrame(scanBarcodeLoop);
    } else {
      msg($('scanStatus'),'신분증 자동인식 중입니다. 바코드가 안 되면 성명검색을 이용하세요.');
    }
    scheduleOcr();
  }catch(e){
    msg($('scanStatus'),'카메라 권한을 허용해 주세요: '+e.message,true);
  }
}

function pauseCamera(){
  scanActive=false;
  if(ocrTimer){clearTimeout(ocrTimer);ocrTimer=null;}
  if(stream) stream.getVideoTracks().forEach(t=>t.enabled=false);
}

function stopCamera(){
  scanActive=false;
  if(ocrTimer){clearTimeout(ocrTimer);ocrTimer=null;}
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }
}

async function scanBarcodeLoop(){
  if(!stream||!detector||!scanActive) return;
  if(!scanBusy && Date.now()-lastDetectAt>1400){
    try{
      const codes=await detector.detect($('video'));
      if(codes && codes.length){
        const raw=(codes[0].rawValue||'').trim();
        if(raw){
          lastDetectAt=Date.now();
          if(/^\d{12}$/.test(raw)){
            scanBusy=true;
            await lookupBarcode(raw);
            scanBusy=false;
            return;
          } else {
            pendingDetectedType='PASS 모바일신분증';
            msg($('scanStatus'),'모바일 신분증 QR/바코드를 감지했습니다. 성명으로 대상자를 선택해 주세요.');
            setTimeout(()=>openNameSearch(true),650);
            return;
          }
        }
      }
    }catch(_ ){}
  }
  requestAnimationFrame(scanBarcodeLoop);
}

async function initOcr(){
  if(ocrWorker||!window.Tesseract) return;
  try{
    msg($('scanStatus'),'카메라 준비 완료 · 신분증 OCR 초기화 중...');
    ocrWorker=await Tesseract.createWorker('kor+eng',1,{logger:m=>{ if(m.status==='recognizing text') $('scanStatus').textContent='신분증 인식 중... '+Math.round((m.progress||0)*100)+'%'; }});
    ocrReady=true;
    msg($('scanStatus'),'신분증 또는 바코드를 비춰주세요.');
  }catch(e){
    ocrReady=false;
    msg($('scanStatus'),'바코드는 자동인식됩니다. 신분증 인식이 어려우면 성명검색을 사용하세요.');
  }
}

function scheduleOcr(){
  if(ocrTimer)clearTimeout(ocrTimer);
  ocrTimer=setTimeout(runOcr,2200);
}

function lev(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return dp[m][n];
}

function findNameFromOcr(raw){
  const compact=String(raw||'').replace(/\s+/g,'');
  const exact=[...new Set(rosterNames.filter(n=>compact.includes(String(n).replace(/\s+/g,''))))];
  if(exact.length===1) return exact[0];
  if(exact.length>1) return '';

  // OCR이 한 글자를 틀린 경우를 보완하되, 한 명만 유일하게 맞을 때만 채택
  const tokens=(String(raw||'').match(/[가-힣]{2,5}/g)||[]);
  let best=[],bestDist=99;
  rosterNames.forEach(name=>{
    const nm=String(name).replace(/\s+/g,'');
    tokens.forEach(t=>{
      if(Math.abs(t.length-nm.length)>1) return;
      const d=lev(t,nm);
      if(d<bestDist){bestDist=d;best=[name];}
      else if(d===bestDist&&!best.includes(name)) best.push(name);
    });
  });
  return bestDist<=1 && best.length===1 ? best[0] : '';
}

async function runOcr(){
  if(!stream||!scanActive) return;
  if(!ocrReady||ocrBusy||scanBusy){scheduleOcr();return;}
  const v=$('video');
  if(!v.videoWidth||!v.videoHeight){scheduleOcr();return;}

  ocrBusy=true;
  try{
    const c=$('ocrCanvas'), ctx=c.getContext('2d',{willReadFrequently:true});

    // 화면 중앙의 신분증 가로 영역만 사용
    const vw=v.videoWidth, vh=v.videoHeight;
    let sw=vw*0.92, sh=sw/1.586;
    if(sh>vh*0.62){ sh=vh*0.62; sw=sh*1.586; }
    const sx=(vw-sw)/2, sy=(vh-sh)/2;

    const outW=1400, outH=Math.round(outW/1.586);
    c.width=outW; c.height=outH;
    ctx.drawImage(v,sx,sy,sw,sh,0,0,outW,outH);

    // 회색조 + 대비 강화
    const img=ctx.getImageData(0,0,c.width,c.height);
    const d=img.data;
    for(let i=0;i<d.length;i+=4){
      let y=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      y=(y-128)*1.55+128;
      y=Math.max(0,Math.min(255,y));
      d[i]=d[i+1]=d[i+2]=y;
    }
    ctx.putImageData(img,0,0);

    const ret=await ocrWorker.recognize(c);
    const raw=((ret&&ret.data&&ret.data.text)||'');
    const compact=raw.replace(/\s+/g,'');
    const found=findNameFromOcr(raw);

    if(found){
      let inferred='';
      if(compact.includes('주민등록증')) inferred='주민등록증';
      else if(compact.includes('운전면허')||compact.includes('면허증')) inferred='운전면허증';
      pendingDetectedType=inferred;
      msg($('scanStatus'),'성명 인식: '+found+' · 명부 확인 중...');
      await lookupNameAuto(found);
      return;
    }

    msg($('scanStatus'),'신분증을 가로로 더 가까이 맞춰주세요.');
  }catch(_){
    msg($('scanStatus'),'신분증 인식이 어려우면 아래 성명검색을 사용하세요.');
  }finally{
    ocrBusy=false;
    if(stream&&scanActive)scheduleOcr();
  }
}

async function lookupBarcode(code){
  try{
    const r=await jsonp('lookupBarcode',{token,barcode:code});
    if(!r.ok||!r.people||!r.people.length){msg($('scanStatus'),r.error||'바코드 인원을 찾지 못했습니다.',true);return;}
    currentMethod='개인바코드';
    pendingDetectedType='';
    openResult(r.people[0]);
  }catch(e){msg($('scanStatus'),e.message,true);}
}

async function lookupNameAuto(name){
  try{
    const r=await jsonp('lookupName',{token,name});
    if(!r.ok||!r.people||!r.people.length) return;
    if(r.people.length===1){
      currentMethod='신분증OCR';
      openResult(r.people[0]);
    } else {
      pauseCamera();
      show('search');
      $('searchName').value=name;
      if(pendingDetectedType) $('searchIdType').value=pendingDetectedType;
      renderCandidates(r.people,'신분증OCR');
      msg($('searchMsg'),'동명이인입니다. 신분증의 생년월일을 보고 대상자를 선택하세요.');
    }
  }catch(_ ){}
}

function openNameSearch(fromMobile=false){
  pauseCamera(); show('search'); clearMsg($('searchMsg')); $('candidates').innerHTML='';
  $('searchName').value='';
  $('searchIdType').value=fromMobile?'PASS 모바일신분증':'';
  $('searchOtherBox').classList.add('hidden'); $('searchOther').value='';
  setTimeout(()=>$('searchName').focus(),100);
}

async function searchName(){
  const type=$('searchIdType').value, other=$('searchOther').value.trim(), name=$('searchName').value.trim();
  if(!type) return msg($('searchMsg'),'먼저 신분증 수단을 선택해 주세요.',true);
  if(type==='기타'&&!other) return msg($('searchMsg'),'기타 신분증 수단을 직접 입력해 주세요.',true);
  if(!name) return msg($('searchMsg'),'성명을 입력해 주세요.',true);
  msg($('searchMsg'),'검색 중...');
  try{
    const r=await jsonp('lookupName',{token,name});
    if(!r.ok||!r.people||!r.people.length){ $('candidates').innerHTML='';return msg($('searchMsg'),'명부에서 찾을 수 없습니다.',true); }
    clearMsg($('searchMsg')); renderCandidates(r.people,pendingDetectedType==='PASS 모바일신분증'?'PASS QR감지후 성명검색':'성명검색');
  }catch(e){msg($('searchMsg'),e.message,true);}
}

function renderCandidates(people,method){
  const box=$('candidates'); box.innerHTML='';
  people.forEach(p=>{
    const d=document.createElement('div'); d.className='candidate';
    d.innerHTML='<b style="font-size:19px">'+esc(p.name)+'</b><br><span>'+esc(p.dob)+' · '+esc(p.company)+' · '+esc(p.platoon)+'</span>';
    const b=document.createElement('button'); b.textContent='이 인원 선택';
    b.onclick=()=>{
      currentMethod=method;
      pendingDetectedType=$('searchIdType').value||pendingDetectedType;
      openResult(p);
    };
    d.appendChild(b); box.appendChild(d);
  });
}

function openResult(p){
  pauseCamera(); currentPerson=p; show('result');
  $('rName').textContent=p.name||''; $('rMilitary').textContent=p.military||'';
  $('rCompany').textContent=p.company||''; $('rPlatoon').textContent=p.platoon||'';
  $('rRole').textContent=p.role||''; $('rGun').textContent=p.gun||''; $('rRoom').textContent=p.room||'';
  $('methodBadge').textContent='검색방법: '+currentMethod;
  const selected = pendingDetectedType || ($('searchIdType')?$('searchIdType').value:'');
  $('idType').value=selected || '';
  $('idTypeOther').value=selected==='기타'?($('searchOther').value||''):'';
  $('otherTypeBox').classList.toggle('hidden',$('idType').value!=='기타');
  clearMsg($('resultMsg'));
}

async function confirmIdentity(){
  if(!currentPerson) return;
  const idType=$('idType').value, idTypeOther=$('idTypeOther').value.trim();
  if(!idType) return msg($('resultMsg'),'신분증 수단을 선택해 주세요.',true);
  if(idType==='기타'&&!idTypeOther) return msg($('resultMsg'),'기타 신분증 수단을 직접 입력해 주세요.',true);
  msg($('resultMsg'),'기록 중...');
  const body={
    action:'idcheckLog',token,barcodeId:currentPerson.barcode,
    idType,idTypeOther,searchMethod:currentMethod
  };
  try{
    await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    msg($('resultMsg'),'신분확인 완료 · 다음 인원을 준비합니다.');
    setTimeout(resetToScan,550);
  }catch(e){msg($('resultMsg'),'기록 전송 실패: '+e.message,true);}
}

function resetToScan(){
  currentPerson=null; currentMethod=''; pendingDetectedType=''; scanBusy=false;
  $('idType').value=''; $('idTypeOther').value=''; $('otherTypeBox').classList.add('hidden');
  show('scan'); startCamera(); initOcr();
}

function esc(v){ return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

window.addEventListener('DOMContentLoaded',()=>{ restoreSession(); });
$('loginBtn').onclick=login;
$('nameSearchBtn').onclick=()=>openNameSearch(false);
$('backScanBtn').onclick=()=>{pendingDetectedType='';show('scan');startCamera();initOcr();};
$('searchBtn').onclick=searchName;
$('searchName').addEventListener('keydown',e=>{if(e.key==='Enter')searchName();});
$('searchIdType').onchange=()=>$('searchOtherBox').classList.toggle('hidden',$('searchIdType').value!=='기타');
$('idType').onchange=()=>$('otherTypeBox').classList.toggle('hidden',$('idType').value!=='기타');
$('confirmBtn').onclick=confirmIdentity;
$('cancelBtn').onclick=resetToScan;

window.addEventListener('beforeunload',()=>{stopCamera();if(ocrWorker)try{ocrWorker.terminate();}catch(_){}});
</script>
</body>
</html>
